services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unity-skill-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Duser.timezone=UTC -Dspring.profiles.active=prod
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unity-skill-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
